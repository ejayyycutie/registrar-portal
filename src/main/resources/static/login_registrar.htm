<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Login - NSC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/registrar_login.css">

</head>
<body class="login-body">

<div class="row g-0">
    <div class="col-lg-6 left-panel d-none d-lg-flex">
        <div class="hero-blob hb-1"></div>
        <div class="hero-blob hb-2"></div>

        <div class="welcome-text position-relative z-2">
            <img src="assets/img/logo.png" style="width: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); margin-bottom: 30px; box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);" onerror="this.src='https://via.placeholder.com/120?text=LOGO'">
            <h1 style="font-weight: 800; font-size: 3.5rem; line-height: 1.2;">REGISTRAR</h1>
            <h3 style="color: #fbbf24; font-weight: 600; letter-spacing: 2px;">MANAGEMENT PORTAL</h3>
            <p style="margin-top: 20px; font-weight: 300; opacity: 0.8; max-width: 400px;">
                Authorized Personnel Only. Manage records and verify documents securely.
            </p>
        </div>
    </div>

    <div class="col-lg-6 right-panel">
        <a href="homepage/home.htm" style="position: absolute; top: 30px; left: 30px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-arrow-left me-2"></i> Back to Website
        </a>

        <div class="login-box">
            <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 10px;">Registrar Login</h2>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem;">Enter your official credentials.</p>

            <div id="errorMsg" class="alert alert-danger d-none rounded-pill text-center py-2 text-small"></div>

            <form id="registrarForm">
                <div class="mb-4">
                    <label class="small text-muted ms-3 mb-1">Registrar ID</label>
                    <div class="input-wrapper">
                        <input type="text" name="reg_id" class="form-control form-control-dark" placeholder="e.g. 102384" required>
                        <i class="fas fa-user-shield input-icon"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="small text-muted ms-3 mb-1">Birthdate (Password)</label>
                    <div class="input-wrapper">
                        <input type="date" name="birthdate" class="form-control form-control-dark" required>
                    </div>
                </div>

                <div class="form-check mb-4 ms-2">
                    <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="remember">
                    <label class="form-check-label small text-muted" for="remember">Keep me logged in</label>
                </div>

                <button type="submit" class="btn btn-registrar" id="loginBtn">
                    Access Dashboard <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('#registrarForm').submit(function(e){
            e.preventDefault();

            // UI Loading State
            $('#loginBtn').html('<i class="fas fa-spinner fa-spin"></i> Verifying...').prop('disabled', true);
            $('#errorMsg').addClass('d-none');

            $.ajax({
                url: '/api/auth/registrar-login',
                type: 'POST',
                data: $(this).serialize(),
                dataType: 'json',
                success: function(res){
                    if(res.status == 'success'){
                        window.location.href = 'registrar/dashboard.htm';
                    } else {
                        $('#errorMsg').text(res.message).removeClass('d-none');
                        $('#loginBtn').html('Access Dashboard <i class="fas fa-arrow-right ms-2"></i>').prop('disabled', false);
                    }
                },
                error: function() {
                    $('#errorMsg').text("System Error. Please try again.").removeClass('d-none');
                    $('#loginBtn').html('Access Dashboard <i class="fas fa-arrow-right ms-2"></i>').prop('disabled', false);
                }
            });
        });
    });
</script>

</body>
</html>
