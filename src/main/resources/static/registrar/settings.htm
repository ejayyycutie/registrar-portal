<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - NSC Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        :root { --primary: #0f204b; --gold: #fbbf24; --sidebar-width: 280px; }
        body { font-family: 'Poppins', sans-serif; background-color: #f3f6f9; overflow-x: hidden; }

        /* --- UNIFIED SIDEBAR STYLES (MATCHING OTHER PAGES) --- */
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: linear-gradient(180deg, #0f204b 0%, #030b18 100%); padding: 30px 20px; color: white; z-index: 1000; display: flex; flex-direction: column; }
        .brand-box { display: flex; align-items: center; gap: 15px; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .brand-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
        /* Standardized Brand Name Font */
        .brand-name { font-weight: 700; font-size: 1.1rem; line-height: 1.2; color: var(--gold); }

        .nav-menu { flex-grow: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
        .nav-item i { width: 25px; font-size: 1.2rem; text-align: center; }

        .logout-box { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-link { color: #ef4444; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 10px 20px; transition: 0.3s; }
        .logout-link:hover { color: #ff6b6b; background: rgba(239, 68, 68, 0.1); border-radius: 12px; }

        /* MAIN CONTENT & SETTINGS UI (UNCHANGED) */
        .main-content { margin-left: var(--sidebar-width); padding: 40px; }
        .settings-card { background: white; border-radius: 20px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; position: relative; overflow: hidden; }
        .settings-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, var(--primary), var(--gold)); }
        .profile-section { text-align: center; margin-bottom: 40px; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #f8fafc; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .role-badge { background: rgba(15, 32, 75, 0.1); color: var(--primary); padding: 5px 15px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; display: inline-block; }
        .form-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: #64748b; margin-bottom: 8px; }
        .input-locked { background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569; border-radius: 10px; padding: 12px 15px; cursor: not-allowed; font-weight: 500; }
        .input-edit { background: white; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px 15px; transition: 0.3s; color: var(--primary); font-weight: 500; }
        .input-edit:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1); outline: none; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9; }
        .section-title { font-weight: 700; color: var(--primary); font-size: 1.1rem; margin: 0; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; width: 100%; transition: 0.3s; margin-top: 30px; box-shadow: 0 5px 15px rgba(15, 32, 75, 0.2); }
        .btn-save:hover { background: #1e3a8a; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand-box">
        <img src="/assets/img/logo.png" class="brand-logo" id="sidebar-profile-pic" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
        <div class="brand-name">NSC REGISTRAR<br><span style="font-size: 0.75rem; opacity: 0.7; font-weight: 400; color: white;">System Panel</span></div>
    </div>

    <nav class="nav-menu">
        <a href="dashboard.htm" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="verification.htm" class="nav-item"><i class="fas fa-file-signature"></i> Verification</a>
        <a href="appointments.htm" class="nav-item"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="records.htm" class="nav-item"><i class="fas fa-users"></i> Student Records</a>
        <a href="settings.htm" class="nav-item active"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="logout-box">
        <a href="../login_registrar.htm" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<div class="main-content">
    <h2 class="fw-bold mb-4" style="color: #0f204b;">Configuration</h2>

    <div class="settings-card">

        <div class="profile-section">
            <img src="/assets/img/logo.png" class="profile-img" id="settings-profile-pic">
            <h3 class="fw-bold mt-3 mb-0 text-dark" id="display-name">Loading...</h3>
            <span class="role-badge">Admin Privileges</span>
        </div>

        <form id="regSettingsForm" enctype="multipart/form-data">

            <div class="section-header">
                <i class="fas fa-id-badge text-warning"></i>
                <h5 class="section-title">Official Identification</h5>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Registrar ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="text" class="form-control input-locked" id="display-id" readonly>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Role / Position</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="text" class="form-control input-locked" value="Head Registrar" readonly>
                    </div>
                </div>
            </div>

            <div class="section-header mt-5">
                <i class="fas fa-building text-primary"></i>
                <h5 class="section-title">Office Contact Information</h5>
            </div>
            <p class="text-muted small mb-3">This information will be visible to students for inquiries.</p>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Official Email</label>
                    <input type="email" name="office_email" id="input-email" class="form-control input-edit" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Office Hotline / Mobile</label>
                    <input type="text" name="office_phone" id="input-phone" class="form-control input-edit" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Update Profile Picture</label>
                    <input type="file" name="imageFile" class="form-control input-edit" accept="image/*">
                </div>
            </div>

            <button type="submit" class="btn-save" id="saveBtn">
                <i class="fas fa-save me-2"></i> Save Changes
            </button>

        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        // Load Data
        $.ajax({
            url: '/api/registrar/profile',
            type: 'GET',
            success: function(res) {
                if (res.status === 'success') {
                    const data = res.data;
                    $('#display-name').text(data.fullname);
                    $('#display-id').val(data.registrarId);
                    $('#input-email').val(data.email);
                    $('#input-phone').val(data.phone);

                    if(data.profilePic) {
                        $('#settings-profile-pic').attr('src', data.profilePic);
                        $('#sidebar-profile-pic').attr('src', data.profilePic);
                    }
                }
            }
        });

        // Submit Data
        $('#regSettingsForm').submit(function(e){
            e.preventDefault();
            var formData = new FormData(this);
            formData.append("reg_id", $('#display-id').val()); // Pass ID dynamically

            $('#saveBtn').html('<i class="fas fa-spinner fa-spin"></i> Saving...').prop('disabled', true);

            $.ajax({
                url: '/api/registrar/update-settings',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                dataType: 'json',
                success: function(res){
                    if(res.status == 'success'){
                        alert("Profile Updated Successfully!");
                        location.reload();
                    } else {
                        alert("Error: " + res.message);
                        $('#saveBtn').html('<i class="fas fa-save me-2"></i> Save Changes').prop('disabled', false);
                    }
                },
                error: function() {
                    alert("System Error.");
                    $('#saveBtn').html('<i class="fas fa-save me-2"></i> Save Changes').prop('disabled', false);
                }
            });
        });
    });
</script>

</body>
</html>
