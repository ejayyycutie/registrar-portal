<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - NSC Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f204b; --gold: #fbbf24; --sidebar-width: 280px; --bg-light: #f3f6f9; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); overflow-x: hidden; }

        /* SIDEBAR STANDARD */
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: linear-gradient(180deg, #0f204b 0%, #030b18 100%); padding: 30px 20px; color: white; z-index: 1000; display: flex; flex-direction: column; }
        .brand-box { display: flex; align-items: center; gap: 15px; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .brand-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
        .brand-text h5 { font-weight: 700; font-size: 1.1rem; line-height: 1.2; color: var(--gold); margin: 0; }
        .brand-text span { font-size: 0.75rem; opacity: 0.7; font-weight: 400; }

        .nav-menu { flex-grow: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
        .nav-item i { width: 25px; font-size: 1.2rem; text-align: center; }

        .logout-box { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-link { color: #ef4444; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 10px 20px; transition: 0.3s; }
        .logout-link:hover { color: #ff6b6b; background: rgba(239, 68, 68, 0.1); border-radius: 12px; }

        /* MAIN CONTENT STANDARD */
        .main-content { margin-left: var(--sidebar-width); padding: 40px; }
        .page-title { font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .page-subtitle { color: #64748b; margin-bottom: 40px; font-size: 0.95rem; }

        /* DASHBOARD CARDS */
        .stat-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: space-between; border-left: 5px solid transparent; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .stat-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }

        /* TABLES */
        .glass-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .table th { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; border-bottom: 2px solid #f1f5f9; }
        .table td { vertical-align: middle; padding: 15px; font-size: 0.95rem; color: #334155; }

        /* ACTION BUTTONS */
        .btn-action { width: 35px; height: 35px; border-radius: 50%; border: none; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; margin: 0 3px; cursor: pointer; }
        .btn-approve { background: #dcfce7; color: #166534; } .btn-approve:hover { transform: scale(1.1); }
        .btn-reject { background: #fee2e2; color: #991b1b; } .btn-reject:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand-box">
        <img src="/assets/img/logo.png" class="brand-logo" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
        <div class="brand-text"><h5>NSC REGISTRAR</h5><span>System Panel</span></div>
    </div>
    <nav class="nav-menu">
        <a href="dashboard.htm" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="verification.htm" class="nav-item"><i class="fas fa-file-signature"></i> Verification</a>
        <a href="appointments.htm" class="nav-item"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="records.htm" class="nav-item"><i class="fas fa-users"></i> Student Records</a>
        <a href="settings.htm" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="logout-box">
        <a href="../login_registrar.htm" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<div class="main-content">
    <h2 class="page-title">Dashboard Overview</h2>
    <p class="page-subtitle">Welcome back, Registrar Officer! Here's what's happening today.</p>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card" style="border-color: #fbbf24;">
                <div><h2 class="fw-bold m-0" id="stat-pending">...</h2><small class="text-muted fw-bold">PENDING REQUESTS</small></div>
                <div class="stat-icon" style="background: #fffbeb; color: #fbbf24;"><i class="fas fa-clock"></i></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-color: #10b981;">
                <div><h2 class="fw-bold m-0" id="stat-sched">...</h2><small class="text-muted fw-bold">APPROVED TODAY</small></div>
                <div class="stat-icon" style="background: #ecfdf5; color: #10b981;"><i class="fas fa-calendar-check"></i></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-color: #3b82f6;">
                <div><h2 class="fw-bold m-0" id="stat-students">...</h2><small class="text-muted fw-bold">TOTAL STUDENTS</small></div>
                <div class="stat-icon" style="background: #eff6ff; color: #3b82f6;"><i class="fas fa-users"></i></div>
            </div>
        </div>
    </div>

    <div class="glass-card">
        <h5 class="fw-bold text-primary mb-4">Recent Requests</h5>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Trans. ID</th><th>Student</th><th>Document</th><th>Date</th></tr></thead>
                <tbody id="pendingTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $.ajax({
            url: '/api/registrar/stats', type: 'GET',
            success: function(data) {
                $('#stat-pending').text(data.pending);
                $('#stat-sched').text(data.approved_today);
                $('#stat-students').text(data.total_students);
            }
        });
        $.ajax({
            url: '/api/registrar/requests/pending', type: 'GET',
            success: function(data) {
                var rows = "";
                if(data.length === 0) { rows = '<tr><td colspan="4" class="text-center text-muted py-3">No pending requests.</td></tr>'; }
                else {
                    $.each(data, function(i, req){
                        rows += `<tr><td><span class="badge bg-light text-dark border">${req.transaction_code}</span></td><td><div class="fw-bold">${req.student_name}</div><small class="text-muted">${req.program}</small></td><td>${req.document_type}</td><td>${req.date_requested.split('T')[0]}</td></tr>`;
                    });
                }
                $('#pendingTableBody').html(rows);
            }
        });
    });
</script>
</body>
</html>
