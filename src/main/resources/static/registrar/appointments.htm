<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointments - NSC Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/Registrar/registrar_appointment.css">
</head>
<body>

<div class="sidebar">
    <div class="brand-box">
        <img src="/assets/img/logo.png" class="brand-logo" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
        <div class="brand-text"><h5>NSC REGISTRAR</h5><span>System Panel</span></div>
    </div>
    <nav class="nav-menu">
        <a href="dashboard.htm" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="verification.htm" class="nav-item"><i class="fas fa-file-signature"></i> Verification</a>
        <a href="appointments.htm" class="nav-item active"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="records.htm" class="nav-item"><i class="fas fa-users"></i> Student Records</a>
        <a href="settings.htm" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="logout-box">
        <a href="../login_registrar.htm" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<div class="main-content">
    <h2 class="page-title">Scheduled Appointments</h2>
    <p class="page-subtitle">Track upcoming document releases.</p>

    <div class="glass-card">
        <table class="table align-middle">
            <thead class="table-light"><tr><th>Date & Time</th><th>Student</th><th>Document</th><th class="text-end">Action</th></tr></thead>
            <tbody id="appointmentsBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){ loadAppointments(); });
    function loadAppointments() {
        $.ajax({
            url: '/api/registrar/requests/approved', type: 'GET',
            success: function(data) {
                var rows = "";
                if(data.length === 0) { rows = '<tr><td colspan="4" class="text-center py-4 text-muted">No upcoming appointments.</td></tr>'; }
                else {
                    $.each(data, function(i, row){
                        rows += `<tr>
                            <td><div class="fw-bold text-primary">${row.sched_date}</div><small class="text-muted">${row.sched_time}</small></td>
                            <td class="fw-bold">${row.student_name}</td>
                            <td>${row.document_type}</td>
                            <td class="text-end"><button class="btn-complete" onclick="markCompleted('${row.transaction_code}')"><i class="fas fa-check-double me-1"></i> Mark Completed</button></td>
                        </tr>`;
                    });
                }
                $('#appointmentsBody').html(rows);
            }
        });
    }
    function markCompleted(code) {
        if(confirm("Mark as completed?")) {
            $.ajax({ url: '/api/registrar/request/process', type: 'POST', data: {action:'complete', trans_code:code}, dataType:'json', success: function(res){ if(res.status === 'success'){ alert('Completed!'); loadAppointments(); } } });
        }
    }
</script>
</body>
</html>
