<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification - NSC Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f204b; --gold: #fbbf24; --sidebar-width: 280px; --bg-light: #f3f6f9; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); overflow-x: hidden; }

        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: linear-gradient(180deg, #0f204b 0%, #030b18 100%); padding: 30px 20px; color: white; z-index: 1000; display: flex; flex-direction: column; }
        .brand-box { display: flex; align-items: center; gap: 15px; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .brand-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
        .brand-text h5 { font-weight: 700; font-size: 1.1rem; line-height: 1.2; color: var(--gold); margin: 0; }
        .brand-text span { font-size: 0.75rem; opacity: 0.7; font-weight: 400; }

        .nav-menu { flex-grow: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
        .nav-item i { width: 25px; font-size: 1.2rem; text-align: center; }

        .logout-box { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-link { color: #ef4444; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 10px 20px; transition: 0.3s; }
        .logout-link:hover { color: #ff6b6b; background: rgba(239, 68, 68, 0.1); border-radius: 12px; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; }
        .page-title { font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .page-subtitle { color: #64748b; margin-bottom: 40px; font-size: 0.95rem; }

        .glass-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .table th { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; border-bottom: 2px solid #f1f5f9; }
        .table td { vertical-align: middle; padding: 15px; font-size: 0.95rem; color: #334155; }

        .btn-check-action { width: 40px; height: 40px; border-radius: 50%; border: none; background: #ecfdf5; color: #059669; transition: 0.3s; }
        .btn-check-action:hover { background: #059669; color: white; transform: scale(1.1); }
        .btn-reject-action { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fef2f2; color: #ef4444; transition: 0.3s; }
        .btn-reject-action:hover { background: #ef4444; color: white; transform: scale(1.1); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand-box">
        <img src="/assets/img/logo.png" class="brand-logo" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
        <div class="brand-text"><h5>NSC REGISTRAR</h5><span>System Panel</span></div>
    </div>
    <nav class="nav-menu">
        <a href="dashboard.htm" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="verification.htm" class="nav-item active"><i class="fas fa-file-signature"></i> Verification</a>
        <a href="appointments.htm" class="nav-item"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="records.htm" class="nav-item"><i class="fas fa-users"></i> Student Records</a>
        <a href="settings.htm" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="logout-box">
        <a href="../login_registrar.htm" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<div class="main-content">
    <h2 class="page-title">Verification Queue</h2>
    <p class="page-subtitle">Review and process pending student requests.</p>

    <div class="glass-card">
        <table class="table align-middle">
            <thead class="table-light">
            <tr><th>Trans. ID</th><th>Student</th><th>Document</th><th class="text-end">Action</th></tr>
            </thead>
            <tbody id="verificationTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="approveModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 p-4" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold text-primary">Set Schedule</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="approvalForm">
                    <input type="hidden" name="action" value="approve">
                    <input type="hidden" name="trans_code" id="modalTransCode">
                    <div class="mb-3"><label class="fw-bold small text-muted">Appointment Date</label><input type="date" name="sched_date" class="form-control" required></div>
                    <div class="mb-3"><label class="fw-bold small text-muted">Time Slot</label><input type="time" name="sched_time" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Confirm & Approve</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){ loadVerificationQueue(); });

    function loadVerificationQueue() {
        $.ajax({
            url: '/api/registrar/requests/pending', type: 'GET',
            success: function(data) {
                var rows = "";
                if(data.length === 0) { rows = '<tr><td colspan="4" class="text-center text-muted py-4">No pending requests found.</td></tr>'; }
                else {
                    $.each(data, function(i, req){
                        rows += `<tr>
                            <td><span class="badge bg-light text-dark border">${req.transaction_code}</span></td>
                            <td><div class="fw-bold text-dark">${req.student_name}</div><small class="text-muted">${req.program}</small></td>
                            <td>${req.document_type}</td>
                            <td class="text-end">
                                <button class="btn-check-action me-2" onclick="openModal('${req.transaction_code}')" title="Approve"><i class="fas fa-check"></i></button>
                                <button class="btn-reject-action" onclick="rejectRequest('${req.transaction_code}')" title="Reject"><i class="fas fa-times"></i></button>
                            </td>
                        </tr>`;
                    });
                }
                $('#verificationTableBody').html(rows);
            }
        });
    }
    function openModal(code) { $('#modalTransCode').val(code); new bootstrap.Modal(document.getElementById('approveModal')).show(); }
    $('#approvalForm').submit(function(e){
        e.preventDefault();
        $.ajax({ url: '/api/registrar/request/process', type: 'POST', data: $(this).serialize(), dataType: 'json', success: function(res){ if(res.status === 'success'){ alert('Approved!'); location.reload(); } else { alert(res.message); } } });
    });
    function rejectRequest(code) {
        if(confirm("Reject this request?")) {
            $.ajax({ url: '/api/registrar/request/process', type: 'POST', data: {action: 'reject', trans_code: code}, dataType: 'json', success: function(res){ if(res.status === 'success'){ alert('Rejected!'); location.reload(); } } });
        }
    }
</script>
</body>
</html>
