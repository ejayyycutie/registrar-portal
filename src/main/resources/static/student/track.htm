<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Status - NSC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root { --primary: #0f204b; --gold: #fbbf24; --blue: #3b82f6; --bg: #f0f4f8; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #334155; overflow-x: hidden; }

        /* Navbar Fixes (Desktop/Base) */
        .navbar { background: var(--primary) !important; padding: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .brand-text { color: white; font-weight: 700; letter-spacing: 1px; font-size: 1.1rem; text-transform: uppercase; }
        .profile-btn { text-decoration: none; color: rgba(255,255,255,0.8) !important; font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .profile-btn:hover { color: var(--gold) !important; }

        /* Hero Section (Desktop/Base) */
        .dashboard-hero {
            background: linear-gradient(135deg, #030b18 0%, #0f204b 100%);
            padding: 80px 0 120px 0;
            text-align: center; color: white; margin-bottom: -60px;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; overflow: hidden;
        }
        .welcome-title { font-weight: 800; font-size: 2.5rem; line-height: 1.2; margin-bottom: 10px; }
        .welcome-sub { font-size: 0.9rem; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }

        /* Track Card */
        .track-card {
            background: white; border-radius: 25px; padding: 40px;
            box-shadow: 0 20px 50px rgba(15, 32, 75, 0.1);
            min-height: 400px; position: relative; z-index: 10; border: 1px solid rgba(255,255,255,0.5);
        }

        /* Timeline Styles */
        .timeline-wrapper { position: relative; padding-left: 20px; margin-top: 30px; }
        .timeline-wrapper::before { content: ''; position: absolute; left: 29px; top: 10px; bottom: 50px; width: 3px; background: #e2e8f0; z-index: 0; }
        .timeline-item { position: relative; margin-bottom: 40px; padding-left: 70px; }
        .timeline-icon {
            position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%;
            background: white; border: 4px solid #f1f5f9; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #cbd5e1; z-index: 1; transition: 0.3s;
        }

        /* Status Colors */
        .t-active .timeline-icon { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.1); animation: pulse 2s infinite; }
        .t-done .timeline-icon { background: #10b981; border-color: #10b981; color: white; }
        .t-fail .timeline-icon { background: #ef4444; border-color: #ef4444; color: white; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        .timeline-content h5 { font-weight: 700; margin-bottom: 5px; font-size: 1.1rem; }
        .timeline-content p { font-size: 0.9rem; color: #64748b; margin: 0; }
        .timeline-date { font-size: 0.8rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }

        /* Appointment Ticket */
        .appointment-ticket {
            background: linear-gradient(135deg, #fffbeb 0%, #fff7ed 100%);
            border-left: 5px solid var(--gold);
            padding: 20px; border-radius: 10px; margin-top: 15px; display: flex; align-items: center; gap: 20px;
        }
        .at-date { font-weight: 800; font-size: 1.5rem; color: var(--primary); line-height: 1; text-align: center; border-right: 1px solid rgba(0,0,0,0.1); padding-right: 20px; }
        .at-time { font-size: 0.9rem; color: #d97706; font-weight: 600; text-transform: uppercase; }
        .at-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        /* Floating Search */
        .floating-search {
            max-width: 600px; margin: -30px auto 40px auto; background: white; padding: 8px; border-radius: 50px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); display: flex; position: relative; z-index: 20;
        }
        .search-field { border: none; flex: 1; padding: 10px 25px; border-radius: 50px; outline: none; font-size: 1rem; }
        .search-btn { background: var(--gold); color: var(--primary); border: none; padding: 10px 40px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .search-btn:hover { background: #f59e0b; }

        /* Mobile View Adjustments (Targeting ONLY Navbar and Hero Section for consistency) */
        @media (max-width: 767px) {
            body { overflow-x: hidden; }

            /* --- NAVBAR ADJUSTMENTS --- */
            .navbar .container {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }
            .navbar-brand img {
                height: 35px !important; /* Smaller logo */
            }
            .brand-text {
                font-size: 0.9rem !important; /* Smaller brand text */
            }
            .profile-btn {
                font-size: 0.8rem !important; /* Smaller Dashboard button text */
            }
            /* --- END NAVBAR ADJUSTMENTS --- */

            /* --- HERO SECTION ADJUSTMENTS --- */
            .dashboard-hero {
                padding: 40px 0 80px 0 !important;
                margin-bottom: -40px !important;
                border-bottom-left-radius: 30px;
                border-bottom-right-radius: 30px;
            }
            .welcome-title {
                font-size: 2rem !important;
            }
            .welcome-sub {
                font-size: 0.8rem !important;
            }
            /* --- END HERO SECTION ADJUSTMENTS --- */

            /* Keeping the rest of the existing mobile styles (search, cards, timeline) */
            .container { padding-left: 15px; padding-right: 15px; }
            .floating-search {
                max-width: 100%;
                margin: -20px 10px 30px 10px;
                padding: 2px;
                border-radius: 20px;
                gap: 5px;
            }
            .search-field {
                padding: 2px 5px;
                font-size: 0.7rem;
            }
            .search-btn {
                padding: 2px 8px;
                font-size: 0.7rem;
                background: var(--gold) !important;
                border: none !important;
            }
            .track-card {
                padding: 15px;
                border-radius: 15px;
                margin: 0 -10px;
            }
            .timeline-wrapper {
                padding-left: 10px;
                margin-top: 20px;
            }
            .timeline-wrapper::before {
                left: 19px;
                width: 2px;
            }
            .timeline-item {
                padding-left: 45px;
                margin-bottom: 25px;
            }
            .timeline-icon {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
            .timeline-content h5 {
                font-size: 0.95rem;
            }
            .timeline-content p {
                font-size: 0.8rem;
            }
            .appointment-ticket {
                flex-direction: column;
                gap: 10px;
                padding: 12px;
                margin-top: 10px;
            }
            .at-date {
                font-size: 1.2rem;
                border-right: none;
                padding-right: 0;
                border-bottom: 1px solid rgba(0,0,0,0.1);
                padding-bottom: 8px;
                margin-bottom: 8px;
            }
            .at-time, .at-label {
                font-size: 0.75rem;
                text-align: center;
            }
            .d-flex.justify-content-between.align-items-end.mb-3 {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 10px;
            }
            .text-end {
                text-align: left !important;
            }

        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container px-4">
        <a class="navbar-brand d-flex align-items-center" href="/student/dashboard.htm">
            <img src="/assets/img/logo.png" onerror="this.src='https://via.placeholder.com/50?text=LOGO'" height="40" class="me-2 rounded-circle" style="border: 2px solid rgba(255,255,255,0.2);">
            <span class="brand-text">Track Status</span>
        </a>
        <div class="ms-auto">
            <a href="/student/dashboard.htm" class="profile-btn"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
        </div>
    </div>
</nav>

<div class="dashboard-hero">
    <div class="container text-center">
        <h1 class="welcome-title">Track Request</h1>
        <p class="welcome-sub">Monitor the progress of your document application.</p>
    </div>
</div>

<div class="container">
    <form action="" method="GET" class="floating-search">
        <input type="text" name="search" class="search-field" placeholder="Enter Transaction Code (e.g. REQ-8821)">
        <button type="button" class="search-btn">Search</button>
    </form>
</div>

<div class="container pb-5">
    <div class="track-card" id="trackContainer">
        <div class="text-center py-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br>Loading requests...
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function(){
        const studentId = localStorage.getItem('nsc_student_id');
        if (studentId) {
            loadMyRequests(studentId);
        } else {
            alert("Session expired. Please login again.");
            window.location.href = '/login_student.htm';
        }

        // Ensure search button works (prevents default form submission if not handled by API)
        $('.search-btn').on('click', function(e) {
            e.preventDefault();
            // Implement search logic here, e.g., filter requests or send new API call
            alert("Search function clicked for Transaction Code: " + $('.search-field').val());
        });
    });

    function loadMyRequests(sid) {
        $.ajax({
            url: '/api/student/requests',
            type: 'GET',
            data: { student_id: sid },
            success: function(data) {
                var container = $('#trackContainer');
                container.empty();

                if (data.length === 0) {
                    container.html(`
                        <div class="text-center py-5">
                            <h4 class="fw-bold text-muted">No Requests Found</h4>
                            <p class="text-muted">You haven't submitted any requests yet.</p>
                            <a href="/student/request.htm" class="btn btn-warning rounded-pill px-4 fw-bold mt-2 text-white shadow">Request Now</a>
                        </div>
                    `);
                    return;
                }

                $.each(data, function(i, req){
                    var statusClass = "";
                    var icon = "";
                    var statusTitle = "";
                    var statusMsg = "";
                    var extraHtml = "";

                    // --- COMPLETE LOGIC ---
                    if(req.status === 'Pending') {
                        statusClass = "t-active";
                        icon = '<i class="fas fa-cog fa-spin"></i>';
                        statusTitle = "Verification in Progress";
                        statusMsg = "Registrar is currently reviewing your academic records.";

                    } else if (req.status === 'Approved') {
                        statusClass = "t-done";
                        icon = '<i class="fas fa-check"></i>';
                        statusTitle = "Approved & Scheduled";
                        statusMsg = "Your request has been approved. See schedule below.";
                        extraHtml = `<div class="appointment-ticket"><div><div class="at-label">Date</div><div class="at-date">${req.sched_date || 'TBA'}</div></div><div><div class="at-label">Time</div><div class="at-time">${req.sched_time || ''}</div></div></div>`;

                    } else if (req.status === 'Completed') {
                        statusClass = "t-done";
                        icon = '<i class="fas fa-check-double"></i>';
                        statusTitle = "Transaction Completed";
                        statusMsg = "Document has been claimed. Thank you!";

                    } else {
                        statusClass = "t-fail";
                        icon = '<i class="fas fa-times"></i>';
                        statusTitle = "Request Declined";
                        statusMsg = "Please visit the Registrar's Office for details.";
                    }

                    var cardHtml = `
                    <div class="border-bottom pb-4 mb-4">
                        <div class="d-flex justify-content-between align-items-end mb-3">
                            <div><small class="text-muted text-uppercase fw-bold letter-spacing-1">Document Type</small><h3 class="fw-bold text-dark m-0">${req.document_type}</h3></div>
                            <div class="text-end"><span class="badge bg-primary px-3 py-2 rounded-pill mb-1">ID: ${req.transaction_code}</span><div class="small text-muted">${req.date_requested.split("T")[0]}</div></div>
                        </div>
                        <div class="timeline-wrapper">
                            <div class="timeline-item t-done"><div class="timeline-icon"><i class="fas fa-file-alt"></i></div><div class="timeline-content"><h5>Request Submitted</h5><p>Application received.</p></div></div>

                            <div class="timeline-item ${statusClass}"><div class="timeline-icon">${icon}</div><div class="timeline-content"><h5 class="${req.status === 'Completed' || req.status === 'Approved' ? 'text-success' : (req.status === 'Declined' ? 'text-danger' : 'text-primary')}">${statusTitle}</h5><p>${statusMsg}</p>${extraHtml}</div></div>

                            ${(req.status === 'Approved' || req.status === 'Completed') ?
                              `<div class="timeline-item ${req.status === 'Completed' ? 't-done' : 't-active'}">
                                  <div class="timeline-icon"><i class="fas fa-hand-holding"></i></div>
                                  <div class="timeline-content">
                                      <h5 class="${req.status === 'Completed' ? 'text-success' : 'text-primary'}">Claim Document</h5>
                                      <p>${req.status === 'Completed' ? 'Document Claimed.' : 'Bring your ID and Transaction Code.'}</p>
                                  </div>
                              </div>` : ''}
                        </div>
                    </div>`;
                    container.append(cardHtml);
                });
            }
        });
    }



</script>
</body>
</html>
