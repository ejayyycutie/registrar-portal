<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Settings - NSC Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/Student/student_setting.css">


</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container px-4">
        <a class="navbar-brand d-flex align-items-center" href="/student/dashboard.htm">
            <img src="/assets/img/logo.png" onerror="this.src='https://via.placeholder.com/50?text=LOGO'" height="40" class="me-2 rounded-circle" style="border: 2px solid rgba(255,255,255,0.2);">
            <span class="brand-text">PROFILE SETTINGS</span>
        </a>
        <div class="ms-auto">
            <a href="/student/dashboard.htm" class="profile-btn">
                <i class="fas fa-arrow-left me-2"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="profile-pic">
        <img src="/assets/img/logo.png" id="settings-profile-pic">
    </div>
    <h3 class="fw-bold mb-0" id="header-name">Loading...</h3>
    <p class="opacity-75 small text-uppercase" style="letter-spacing: 1px;" id="header-prog">...</p>
</div>

<div class="container pb-5">
    <div class="settings-container">

        <form id="profileForm">
            <input type="hidden" name="student_id" id="form-id">

            <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px;">
                <i class="fas fa-lock me-2 text-warning"></i><span style="font-weight: 700; color: #0f204b;">OFFICIAL RECORDS</span>
            </div>

            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" class="form-control input-locked" id="display-id" readonly>
            </div>
            <div class="mb-4">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control input-locked" id="display-name" readonly>
            </div>

            <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px; margin-top: 30px;">
                <i class="fas fa-pen me-2 text-primary"></i><span style="font-weight: 700; color: #0f204b;">CONTACT INFO</span>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" id="input-email" class="form-control input-edit border-start-0" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-phone text-muted"></i></span>
                    <input type="text" name="phone" id="input-phone" class="form-control input-edit border-start-0" required>
                </div>
            </div>

            <button type="submit" id="saveBtn" class="btn-save">Save Changes</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function(){
        const studentId = localStorage.getItem('nsc_student_id');
        if(studentId) {
            // Fetch Data + Picture
            $.ajax({
                url: '/api/registrar/student/' + studentId,
                type: 'GET',
                success: function(res){
                    if(res.status === 'success'){
                        const s = res.student;
                        $('#header-name').text(s.firstname + ' ' + s.lastname);
                        $('#header-prog').text(s.program);
                        $('#form-id').val(s.studentId);
                        $('#display-id').val(s.studentId);
                        $('#display-name').val(s.firstname + ' ' + s.lastname);
                        $('#input-email').val(s.email);
                        $('#input-phone').val(s.phone);

                        // UPDATE PICTURE
                        if (s.profilePic) {
                            $('#settings-profile-pic').attr('src', s.profilePic);
                        }
                    }
                }
            });

            // Submit Update
            $('#profileForm').submit(function(e){
                e.preventDefault();
                $.ajax({
                    url: '/api/registrar/student/update',
                    type: 'POST',
                    data: $(this).serialize(),
                    dataType: 'json',
                    success: function(res){ alert(res.message); location.reload(); }
                });
            });
        } else { window.location.href = '/login_student.htm'; }
    });
</script>

</body>
</html>
