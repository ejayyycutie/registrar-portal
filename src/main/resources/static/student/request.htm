<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request - NSC Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root { --primary: #0f204b; --gold: #fbbf24; --blue: #3b82f6; --bg: #f0f4f8; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #334155; }

        /* UNIFIED NAVBAR STYLES */
        .navbar { background: var(--primary) !important; padding: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .brand-text { color: white; font-weight: 700; letter-spacing: 1px; font-size: 1.1rem; text-transform: uppercase; }

        /* Unified Dashboard Button */
        .profile-btn { text-decoration: none; color: rgba(255,255,255,0.8) !important; font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .profile-btn:hover { color: var(--gold) !important; }

        /* Page Specifics */
        .page-header {
            background: linear-gradient(135deg, #030b18 0%, #0f204b 100%);
            padding: 60px 0 120px 0;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            text-align: center; color: white; margin-bottom: -60px; position: relative; overflow: hidden;
        }
        .hero-blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.3; }
        .hb-1 { width: 300px; height: 300px; background: var(--blue); top: -100px; right: -50px; }

        .glass-card { background: white; border-radius: 25px; padding: 40px; box-shadow: 0 20px 50px rgba(15, 32, 75, 0.1); position: relative; z-index: 10; border: 1px solid rgba(255,255,255,0.5); }
        .form-label { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-control, .form-select { border-radius: 15px; padding: 12px 15px; border: 2px solid #f1f5f9; background: #f8fafc; font-size: 0.95rem; transition: 0.3s; color: #334155; }
        .form-control:focus, .form-select:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }
        .btn-submit { background: linear-gradient(90deg, var(--blue), var(--primary)); border: none; border-radius: 50px; padding: 15px; width: 100%; color: white; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container px-4">
        <a href="/student/dashboard.htm" class="navbar-brand d-flex align-items-center">
            <img src="/assets/img/logo.png" onerror="this.src='https://via.placeholder.com/50?text=LOGO'" height="40" class="me-2 rounded-circle" style="border: 2px solid rgba(255,255,255,0.2);">
            <span class="brand-text">NSC REQUEST</span>
        </a>
        <div class="ms-auto">
            <a href="/student/dashboard.htm" class="profile-btn">
                <i class="fas fa-arrow-left me-2"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="hero-blob hb-1"></div>
    <div class="container">
        <h1 class="fw-bold display-5 mb-2">Request Documents</h1>
        <p class="opacity-75">Select the document you need and we'll process it.</p>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-card">
                <form id="requestForm">
                    <input type="hidden" name="student_id" id="form-student-id">
                    <div class="mb-4">
                        <label class="form-label">Type of Document</label>
                        <select class="form-select" name="doc_type" required>
                            <option selected disabled value="">Tap to select document...</option>
                            <option value="Transcript of Records">Transcript of Records (TOR)</option>
                            <option value="Diploma">Diploma</option>
                            <option value="Certificate of Grades">Certificate of Grades</option>
                            <option value="Good Moral">Good Moral Character</option>
                            <option value="Honorable Dismissal">Honorable Dismissal</option>
                        </select>
                    </div>
                    <div class="mb-4"><label class="form-label">Purpose of Request</label><textarea class="form-control" name="purpose" rows="3" placeholder="e.g. Board Exam..." required></textarea></div>
                    <div class="mb-5"><label class="form-label">Number of Copies</label><input type="number" name="copies" class="form-control fw-bold text-center" value="1" min="1" max="5" required></div>
                    <button type="submit" class="btn-submit">Submit Application <i class="fas fa-paper-plane ms-2"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        const studentId = localStorage.getItem('nsc_student_id');
        if(studentId) { $('#form-student-id').val(studentId); }
        else { alert("Session expired."); window.location.href = '/login_student.htm'; }

        $('#requestForm').submit(function(e){
            e.preventDefault();
            $('.btn-submit').html('<i class="fas fa-spinner fa-spin"></i> Processing...').prop('disabled', true);
            $.ajax({
                url: '/api/request/submit',
                type: 'POST',
                data: $(this).serialize(),
                dataType: 'json',
                success: function(res){
                    if(res.status == 'success'){ alert("Success! Code: " + res.code); window.location.href = '/student/track.htm'; }
                    else { alert("Error: " + res.message); $('.btn-submit').html('Submit Application').prop('disabled', false); }
                },
                error: function() { alert("System Error."); $('.btn-submit').html('Submit Application').prop('disabled', false); }
            });
        });
    });
</script>
</body>
</html>
